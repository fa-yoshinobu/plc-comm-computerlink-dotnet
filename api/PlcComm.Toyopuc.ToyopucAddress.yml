  assemblies:
  - PlcComm.Toyopuc
  namespace: PlcComm.Toyopuc
  summary: Public helpers for TOYOPUC address parsing, formatting, normalization, and low-level encoding.
  remarks: >-
    This type serves two audiences:


    <ul><li>Applications that need canonical address text for generated documentation or UI.</li><li>Low-level tooling that needs to encode resolved addresses into transport-specific numeric forms.</li></ul>


    The higher-level parse, format, and normalize methods are the recommended public entry points for most callers.
