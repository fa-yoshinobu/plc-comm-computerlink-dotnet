  summary: Creates, configures, and opens a queued TOYOPUC client.
  remarks: >-
    When <xref href="PlcComm.Toyopuc.ToyopucConnectionOptions.RelayHops" data-throw-if-not-resolved="false"></xref> is supplied, the returned queued client keeps

    the normalized relay chain available through <xref href="PlcComm.Toyopuc.QueuedToyopucDeviceClient.RelayHops" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static Task<QueuedToyopucDeviceClient> OpenAndConnectAsync(ToyopucConnectionOptions options, CancellationToken cancellationToken = default)
    parameters:
    - id: options
      type: PlcComm.Toyopuc.ToyopucConnectionOptions
      description: Explicit connection options.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancellation token.
    return:
      type: System.Threading.Tasks.Task{PlcComm.Toyopuc.QueuedToyopucDeviceClient}
      description: A connected queued client.
    content.vb: Public Shared Function OpenAndConnectAsync(options As ToyopucConnectionOptions, cancellationToken As CancellationToken = Nothing) As Task(Of QueuedToyopucDeviceClient)
