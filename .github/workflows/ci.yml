name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release workflows do not auto-publish
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore PlcComm.Toyopuc.sln

      - name: Build
        run: dotnet build PlcComm.Toyopuc.sln -c Release --no-restore

      - name: Check generated API reference
        run: |
          python scripts/test_generate_api_reference.py
          python scripts/generate_api_reference.py --assembly src/Toyopuc/bin/Release/net8.0/PlcComm.Toyopuc.dll --xml src/Toyopuc/bin/Release/net8.0/PlcComm.Toyopuc.xml --output docsrc/user/API_REFERENCE.md --title "TOYOPUC Computerlink .NET API Reference" --package PlcComm.Toyopuc --check

      - name: Test
        run: dotnet test PlcComm.Toyopuc.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Validate NuGet package contents
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

      - name: Format check
        run: dotnet format PlcComm.Toyopuc.sln --verify-no-changes --no-restore

      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/test-results.trx"
          if-no-files-found: ignore
          retention-days: 7

  linux-network-contract-smoke:
    name: Linux bounded network-contract smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup representative .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run loopback lifecycle contract smoke
        run: >-
          dotnet test tests/PlcComm.Toyopuc.Tests/PlcComm.Toyopuc.Tests.csproj
          -c Release
          -f net10.0
          --filter "Category=LinuxNetworkContractSmoke"
          --logger "trx;LogFileName=linux-network-contract-smoke.trx"

      - name: Upload smoke results
        uses: actions/upload-artifact@v7
        with:
          name: linux-network-contract-smoke-results
          path: "**/linux-network-contract-smoke.trx"
          if-no-files-found: error
          retention-days: 7
